<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テニスサークル Webサイト</title>
    <!-- CSSファイルを読み込みます -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダーエリア -->
    <header>
        <div class="header-container">
            <h1>テニスサークル</h1>
            <nav>
                <ul>
                    <li><a href="#about">サークル紹介</a></li>
                    <li><a href="#gallery">ギャラリー</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <!-- サークル紹介セクション -->
        <section id="about" class="section">
            <h2>サークル紹介</h2>
            <p>私たちのテニスサークルへようこそ！初心者から経験者まで、みんなで楽しく汗を流しています。</p>
            <table class="info-table">
                <tr>
                    <th>活動場所</th>
                    <td>大橋キャンパステニスコート</td>
                </tr>
                <tr>
                    <th>活動日時</th>
                    <td>不定期</td>
                </tr>
            </table>
        </section>

        <!-- ギャラリーセクション -->
        <section id="gallery" class="section">
            <h2>ギャラリー</h2>
            <p>普段の練習やイベントの様子です。</p>
            <div class="gallery-grid">
                
                <div class="gallery-item"><img src="image1.jpg" alt="練習風景1"></div>
                <div class="gallery-item"><img src="image2.HEIC" alt="練習風景2"></div>
                <div class="gallery-item"><img src="image3.HEIC" alt="試合の様子"></div>
            </div>
        </section>
    </main>

    <!-- フッターエリア -->
    <footer>
        <p>&copy; 2026 テニスサークル. All Rights Reserved.</p>
    </footer>

</body>
</html>
